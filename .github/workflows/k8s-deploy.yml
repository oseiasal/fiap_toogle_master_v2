name: ☸️ Kubernetes GitOps Deploy Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'k8s/**'
  workflow_dispatch:
    inputs:
      overlay:
        description: 'Overlay Kustomize a aplicar'
        required: true
        type: choice
        options:
          - 'k8s/overlays/prod'
          - 'k8s/overlays/local'
        default: 'k8s/overlays/prod'
      dry_run:
        description: 'Executar em modo Dry-Run (apenas validação)'
        required: false
        type: boolean
        default: false
      run_smoke_tests:
        description: 'Executar smoke tests após o deploy'
        required: false
        type: boolean
        default: true

concurrency:
  group: k8s-deploy-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ☸️ Deploy to Amazon EKS (Kustomize)
    permissions:
      id-token: write
      contents: read
    uses: oseiasal/.github/.github/workflows/reusable-kustomize-deploy.yml@main
    with:
      k8s_overlay: ${{ inputs.overlay || 'k8s/overlays/prod' }}
      cluster_name: 'toogle-cluster'
      aws_region: 'us-east-1'
      namespace: 'toogle-master'
      dry_run: ${{ inputs.dry_run || false }}
      run_smoke_tests: ${{ inputs.run_smoke_tests || true }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
