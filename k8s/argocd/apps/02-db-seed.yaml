apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tooglemaster-db-seed
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/oseiasal/fiap_toogle_master_v2.git'
    targetRevision: master
    path: 'k8s/overlays/prod'
    directory:
      include: 'db-init-job.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: toogle-master
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
