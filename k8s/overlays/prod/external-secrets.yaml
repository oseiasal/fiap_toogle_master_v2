apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-service-external-secret
  namespace: toogle-master
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: auth-service-secret
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: /tooglemaster/dev/auth
