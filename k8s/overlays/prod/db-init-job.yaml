apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-seed-job
  namespace: toogle-master
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql-initializer
          image: postgres:15-alpine
          env:
            - name: AUTH_DB_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: DATABASE_URL
            - name: FLAG_DB_URL
              valueFrom:
                secretKeyRef:
                  name: flag-service-secret
                  key: DATABASE_URL
            - name: TARGETING_DB_URL
              valueFrom:
                secretKeyRef:
                  name: targeting-service-secret
                  key: DATABASE_URL
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "=========================================="
              echo " INICIANDO SEED VIA KUBERNETES SECRETS"
              echo "=========================================="

              # 1. AUTH DB
              echo "==> [1/3] Criando e populando auth_db..."
              ADMIN_AUTH_URL=$(echo "$AUTH_DB_URL" | sed 's|/auth_db|/postgres|')
              psql "$ADMIN_AUTH_URL" -c "CREATE DATABASE auth_db;" || true
              psql "$AUTH_DB_URL" -c "
                CREATE TABLE IF NOT EXISTS api_keys (
                  id SERIAL PRIMARY KEY,
                  name VARCHAR(100) NOT NULL,
                  key_hash VARCHAR(64) NOT NULL UNIQUE,
                  is_active BOOLEAN DEFAULT true,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
                );
                INSERT INTO api_keys (name, key_hash, is_active)
                VALUES (
                  'Evaluation Service Default Key',
                  '8cfe60ccf86afc21b71ebb7c1550c3fcfa0e796379c4da95007b9aa41ea2b86c',
                  true
                )
                ON CONFLICT (key_hash) DO NOTHING;
              "

              # 2. FLAG DB
              echo "==> [2/3] Criando e populando flag_db..."
              ADMIN_FLAG_URL=$(echo "$FLAG_DB_URL" | sed 's|/flag_db|/postgres|')
              psql "$ADMIN_FLAG_URL" -c "CREATE DATABASE flag_db;" || true
              psql "$FLAG_DB_URL" -c "
                CREATE TABLE IF NOT EXISTS flags (
                  id SERIAL PRIMARY KEY,
                  name VARCHAR(100) UNIQUE NOT NULL,
                  description TEXT,
                  is_enabled BOOLEAN NOT NULL DEFAULT false,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
                  updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
                );
              "

              # 3. TARGETING DB
              echo "==> [3/3] Criando e populando targeting_db..."
              ADMIN_TARGETING_URL=$(echo "$TARGETING_DB_URL" | sed 's|/targeting_db|/postgres|')
              psql "$ADMIN_TARGETING_URL" -c "CREATE DATABASE targeting_db;" || true
              psql "$TARGETING_DB_URL" -c "
                CREATE TABLE IF NOT EXISTS targeting_rules (
                  id SERIAL PRIMARY KEY,
                  flag_name VARCHAR(100) UNIQUE NOT NULL,
                  is_enabled BOOLEAN NOT NULL DEFAULT true,
                  rules JSONB NOT NULL,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
                  updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
                );
              "

              echo "=========================================="
              echo " SEED CONCLUIDO COM SUCESSO EM TODOS OS BANCOS!"
              echo "=========================================="
