apiVersion: v1
kind: ConfigMap
metadata:
  name: targeting-service-config
  namespace: toogle-master
data:
  PORT: "8003"
  AUTH_SERVICE_URL: "http://auth-service.toogle-master.svc.cluster.local:8001"
  OTEL_SERVICE_NAME: "targeting-service"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.toogle-master.svc.cluster.local:4318"

---
apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: toogle-master
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8003"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: targeting-service
  ports:
    - protocol: TCP
      port: 8003
      targetPort: 8003
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: toogle-master
spec:
  replicas: 2
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: targeting-service
        image: 665303623973.dkr.ecr.us-east-1.amazonaws.com/targeting-service:latest
        ports:
        - containerPort: 8003
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: targeting-service-config
              key: PORT
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: targeting-service-config
              key: AUTH_SERVICE_URL
        - name: OTEL_SERVICE_NAME
          valueFrom:
            configMapKeyRef:
              name: targeting-service-config
              key: OTEL_SERVICE_NAME
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: targeting-service-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: targeting-service-secret
              key: DATABASE_URL
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
