global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'tooglemaster-microservices'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'auth-service:8001'
          - 'flag-service:8002'
          - 'targeting-service:8003'
          - 'evaluation-service:8004'
          - 'analytics-service:8005'
